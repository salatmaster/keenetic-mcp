<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560">
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; font-size: 15px; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .you { fill: #F0F4FA; font-weight: 600; }
    .say { fill: #C5CEDB; }
    .dim { fill: #7D8AA0; }
    .tool { fill: #B392F0; }
    .cell { fill: #E6EDF3; }
    .good { fill: #56D364; }
    .warn { fill: #F0B429; }
    .blue { fill: #4AA8FF; }
  </style>
  <defs>
    <clipPath id="win"><rect x="0.5" y="0.5" width="899" height="559" rx="14"/></clipPath>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#1A6EE8"/>
      <stop offset="1" stop-color="#3DB9F7"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#win)">
    <rect width="900" height="560" fill="#0D1320"/>
    <rect width="900" height="40" fill="#141C2C"/>
    <line x1="0" y1="40.5" x2="900" y2="40.5" stroke="#232C3D"/>
  </g>
  <rect x="0.5" y="0.5" width="899" height="559" rx="14" fill="none" stroke="#2A3448"/>
  <circle cx="22" cy="20" r="6" fill="#FF5F57"/>
  <circle cx="42" cy="20" r="6" fill="#FEBC2E"/>
  <circle cx="62" cy="20" r="6" fill="#28C840"/>
  <text x="450" y="25" text-anchor="middle" class="sans dim" font-size="13">your agent  ·  keenetic-mcp</text>

  <text x="32" y="82" class="mono"><tspan class="blue" font-weight="700">&gt;</tspan><tspan x="52" class="you">who is using the most bandwidth right now?</tspan></text>

  <circle cx="37" cy="113" r="4" fill="#B392F0"/>
  <text x="52" y="118" class="mono"><tspan class="tool">list_devices</tspan><tspan class="dim">(filter: active, sort: traffic)</tspan></text>

  <text x="52" y="154" class="mono say">Three devices are active. By traffic:</text>

  <g class="mono">
    <text x="68" y="190" class="cell">work-laptop</text>
    <text x="238" y="190" class="dim">Wi-Fi 5 GHz</text>
    <text x="388" y="190" class="good">-46 dBm</text>
    <text x="580" y="190" class="cell" text-anchor="end">7.7 GB</text>
    <rect x="600" y="179" width="200" height="12" rx="3" fill="url(#bar)"/>

    <text x="68" y="216" class="cell">living-room-tv</text>
    <text x="238" y="216" class="dim">wired</text>
    <text x="580" y="216" class="cell" text-anchor="end">3.2 GB</text>
    <rect x="600" y="205" width="83" height="12" rx="3" fill="url(#bar)"/>

    <text x="68" y="242" class="cell">hallway-camera</text>
    <text x="238" y="242" class="dim">Wi-Fi 2.4 GHz</text>
    <text x="388" y="242" class="good">-48 dBm</text>
    <text x="580" y="242" class="cell" text-anchor="end">5.4 MB</text>
    <rect x="600" y="231" width="3" height="12" rx="1.5" fill="url(#bar)"/>
  </g>

  <text x="52" y="280" class="mono say">The laptop has a strong signal, so it is simply downloading</text>
  <text x="52" y="304" class="mono say">a lot rather than fighting for coverage.</text>

  <text x="32" y="350" class="mono"><tspan class="blue" font-weight="700">&gt;</tspan><tspan x="52" class="you">block the camera for now</tspan></text>

  <circle cx="37" cy="381" r="4" fill="#B392F0"/>
  <text x="52" y="386" class="mono"><tspan class="tool">update_device</tspan><tspan class="dim">(hallway-camera, access: deny)</tspan></text>

  <path d="M47 416l5 5 9-11" fill="none" stroke="#56D364" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="74" y="422" class="mono"><tspan class="cell">Blocked hallway-camera.</tspan><tspan class="dim"> Read back from the router: it holds.</tspan></text>

  <circle cx="54" cy="442" r="8" fill="none" stroke="#F0B429" stroke-width="2"/>
  <rect x="53" y="436.5" width="2" height="6.5" rx="1" fill="#F0B429"/>
  <circle cx="54" cy="446.5" r="1.3" fill="#F0B429"/>
  <text x="74" y="447" class="mono"><tspan class="warn">Not saved:</tspan><tspan class="say"> a reboot undoes it. Backup taken before the change.</tspan></text>

  <text x="74" y="472" class="mono dim">Say the word and I will make it permanent.</text>

  <text x="32" y="522" class="mono blue" font-weight="700">&gt;</text>
  <rect x="52" y="508" width="9" height="18" fill="#4AA8FF" fill-opacity="0.8"/>
</svg>
