<svg xmlns="http://www.w3.org/2000/svg" width="560" height="360" viewBox="0 0 560 360">
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .hi { fill: #F0F4FA; }
    .txt { fill: #C5CEDB; }
    .dim { fill: #7D8AA0; }
    .tool { fill: #B392F0; }
    .good { fill: #56D364; }
    .warn { fill: #F0B429; }
    .bad { fill: #FF7B72; }
    .blue { fill: #4AA8FF; }
  </style>
  <rect x="0.5" y="0.5" width="559" height="359" rx="14" fill="#0D1320" stroke="#2A3448"/>
  <text x="24" y="40" class="mono tool" font-size="14">get_internet_status</text>
  <rect x="24" y="56" width="140" height="36" rx="18" fill="#56D364" fill-opacity="0.12"/>
  <path d="M42 72 l4 4 8-9" fill="none" stroke="#56D364" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="64" y="79" class="sans hi" font-size="14">Gateway</text>
  <rect x="176" y="56" width="110" height="36" rx="18" fill="#FF7B72" fill-opacity="0.12"/>
  <path d="M193 69 l9 9 M202 69 l-9 9" fill="none" stroke="#FF7B72" stroke-width="2.4" stroke-linecap="round"/><text x="214" y="79" class="sans bad" font-size="14">DNS</text>
  <rect x="298" y="56" width="168" height="36" rx="18" fill="#FF7B72" fill-opacity="0.12"/>
  <path d="M315 69 l9 9 M324 69 l-9 9" fill="none" stroke="#FF7B72" stroke-width="2.4" stroke-linecap="round"/><text x="336" y="79" class="sans bad" font-size="14">Captive check</text>

  <text x="24" y="142" class="mono" font-size="14"><tspan class="tool">traceroute</tspan><tspan class="dim">(host: 1.1.1.1)</tspan><tspan class="dim" dx="12">from the router</tspan></text>
  <g class="mono" font-size="14">
    <text x="24" y="176" class="dim">1</text><text x="52" y="176" class="txt">198.51.100.1</text><text x="400" y="176" class="good" text-anchor="end">2.1 ms</text>
    <text x="24" y="202" class="dim">2</text><text x="52" y="202" class="txt">198.51.100.77</text><text x="400" y="202" class="good" text-anchor="end">4.8 ms</text>
    <text x="24" y="228" class="dim">3</text><text x="52" y="228" class="dim">* * *</text>
    <text x="24" y="254" class="dim">4</text><text x="52" y="254" class="txt">1.1.1.1</text><text x="400" y="254" class="good" text-anchor="end">9.6 ms</text>
  </g>
  <rect x="24" y="282" width="512" height="54" rx="10" fill="#161E2E" stroke="#2A3448"/>
  <text x="40" y="304" class="sans hi" font-size="14">The line is fine and packets get out. Names do not resolve:</text>
  <text x="40" y="324" class="sans hi" font-size="14">change the DNS servers, the cable is not the problem.</text>
</svg>
